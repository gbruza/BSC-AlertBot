services:
  - type: web
    name: bsc-alertbot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k eventlet -w 1 "backend.app:create_app()"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bsc-alertbot-db
          property: connectionString

databases:
  - name: bsc-alertbot-db
    plan: free
    databaseName: bsc_alertbot
    user: bsc_alertbot
